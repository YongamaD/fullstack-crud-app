services:
  db:
    image: postgres:16
    container_name: fullstack_crud_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fullstack_crud_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app_dev?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-at-least-32-characters-long-secret-key}
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: fullstack_crud_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
